<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>成绩统计</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fb;color:#1f2d3d}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 80px}
header{background:#c00000;color:#fff;border-radius:10px;padding:16px 18px;margin-bottom:16px}
header h1{font-size:20px}
header p{font-size:13px;opacity:.92;margin-top:4px}
.form-meta{display:flex;flex-wrap:wrap;gap:12px;background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:14px 16px;margin-bottom:16px}
.form-meta .field{flex:1;min-width:150px}
.form-meta label{font-size:13px;color:#6b7788;display:block;margin-bottom:4px}
.form-meta input{width:100%;border:1px solid #dbe4ea;border-radius:6px;padding:9px 10px;font-size:15px}
details.guide{background:#fffdf7;border:1px solid #e8d9a8;border-radius:10px;padding:12px 16px;margin-bottom:16px}
details.guide summary{cursor:pointer;font-size:15px;font-weight:700;color:#8a6d1a}
.gtab{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.gtab th,.gtab td{border:1px solid #e8d9a8;padding:6px 8px;text-align:center}
.gtab th{background:#faf3e3;color:#6b5a1e}
.gtab td:first-child{text-align:left;font-weight:600}
.gnote{font-size:12px;color:#8a6d1a;margin-top:8px;line-height:1.6}
.searchbar{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:12px 16px;margin-bottom:16px}
.searchbar label{font-size:13px;color:#6b7788;display:block;margin-bottom:6px}
.searchrow{display:flex;align-items:center;gap:10px}
.searchrow input{flex:1;border:2px solid #c00000;border-radius:8px;padding:10px 12px;font-size:15px}
.qhint{font-size:12px;color:#2e9e5b;white-space:nowrap}
.qclear{font-size:12px;color:#c00000;cursor:pointer;white-space:nowrap}
.case{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.case .case-title{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dir-tag{font-size:11px;color:#555;background:#eef1f5;border:1px solid #d5dbe4;border-radius:10px;padding:1px 8px;font-weight:400;white-space:nowrap}
.no{background:#f2f4f7;border-radius:5px;padding:2px 8px;font-size:12px;color:#6b7788}
.dims{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.dim label{display:block;font-size:12px;color:#6b7788;margin-bottom:3px}
.dim input{width:100%;border:1px solid #dbe4ea;border-radius:6px;padding:8px;font-size:15px}
.total{display:flex;align-items:center;gap:10px;border-top:1px dashed #e3e8f0;padding-top:10px}
.total label{font-size:14px;font-weight:700}
.total .star{color:#c00000}
.total input{width:90px;border:2px solid #c00000;border-radius:6px;padding:8px;font-size:16px;font-weight:700;text-align:center}
.total .hint{font-size:12px;color:#6b7788}
.total input.auto{background:#e8f7ee;border-color:#2e9e5b}
.case.err{border:2px solid #c00000;background:#fff6f6}
.dim input:disabled{background:#f5f7fa}
.bar{position:sticky;bottom:0;background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:14px;margin-top:18px;box-shadow:0 -4px 12px rgba(0,0,0,.05)}
.bar .count{font-size:13px;color:#4b5563;flex:1}
.bar #msg{font-size:13px;max-width:40%}
#msg.ok{color:#2e9e5b}
#msg.err{color:#c00000}
.submit-btn{background:#c00000;color:#fff;border:0;border-radius:8px;padding:12px 26px;font-size:16px;cursor:pointer}
.save-btn{background:#5a6a7a;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:14px;cursor:pointer;margin-right:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99}
.mbox{background:#fff;border-radius:12px;padding:26px 20px;width:88%;max-width:340px;text-align:center}
.mbox p{font-size:15px;color:#1f2d3d;margin-bottom:20px;line-height:1.6}
.mbox button{border:0;border-radius:8px;padding:11px 20px;font-size:14px;cursor:pointer;margin:0 6px;font-weight:600}
.mbox .cancel{background:#eef1f5;color:#4b5563}
.mbox .okbtn{background:#c00000;color:#fff}
.submit-btn:disabled{opacity:.6}
.btn{display:inline-block;background:#c00000;color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:15px;text-decoration:none;margin-right:10px}
.card{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:22px;margin-bottom:16px}
.card h2{font-size:17px;margin-bottom:6px}
.card p{color:#6b7785;font-size:13px;margin-bottom:14px}
.btn.gray{background:#5a6a7a}
.btn.plain{background:#fff;color:#c00000;border:1px solid #c00000}
.note{font-size:12px;color:#9aa5b1;margin-top:10px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #e3e8f0;padding:8px 10px;text-align:left}
th{background:#f7f8fb;font-weight:600}
td.num,th.num{text-align:center}
.empty{color:#9aa5b1;text-align:center;padding:20px;font-size:13px}
.block{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:18px;margin-bottom:24px}
.block h2{font-size:17px;margin-bottom:4px}
.block .meta{font-size:12px;color:#6b7788;margin-bottom:12px}
.qr-img{width:170px;height:170px;border:1px solid #e3e8f0;border-radius:8px}
.pager{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 0;background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:10px}
.pager .pginfo{font-size:13px;color:#6b7788;align-self:center;margin-right:6px}
.pgbtn{border:1px solid #d4dbe6;background:#fff;border-radius:6px;padding:8px 12px;font-size:14px;cursor:pointer}
.pgbtn.on{background:#c00000;color:#fff;border-color:#c00000}
.pgbtn:disabled{opacity:.4;cursor:not-allowed}
.pgbtn span{font-size:11px;opacity:.8}
input.over{border:2px solid #c00000 !important;background:#fff6f6}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tab{border:1px solid #c00000;background:#fff;color:#c00000;border-radius:8px;padding:10px 24px;font-size:15px;cursor:pointer}
.tab.on{background:#c00000;color:#fff}

.toolbar{margin:0 auto 16px}
.refresh{background:#fff;border:1px solid #c00000;color:#c00000;border-radius:6px;padding:8px 14px;cursor:pointer}
.pwd{display:flex;gap:10px;margin-bottom:16px}
.pwd input{flex:1;border:1px solid #dbe4ea;border-radius:6px;padding:10px;font-size:15px}
.qr-row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.sub-title{font-size:15px;font-weight:600;margin:18px 0 8px;color:#1f2d3d}
details.judge-box{border:1px solid #e3e8f0;border-radius:8px;margin-bottom:8px;background:#fff}
details.judge-box summary{cursor:pointer;padding:10px 14px;font-size:14px;font-weight:600;list-style:none}
details.judge-box summary::before{content:'▸ ';color:#c00000}
details.judge-box[open] summary::before{content:'▾ '}
details.judge-box .inner{padding:6px 14px 14px;overflow-x:auto}
small.dim-head{color:#9aa5b1;font-weight:400}
</style></head>
<body><div class="wrap">
<h1>评分统计管理台</h1>
<div class="toolbar"><button class="refresh" onclick="location.reload()">刷新</button> <a href="index.html">← 返回首页</a></div>
<div class="pwd"><input type="password" id="pwd" placeholder="管理口令"><button class="refresh" onclick="load(true)">加载结果</button></div>
<div id="blocks"></div>
<div class="note">计分口径：每案例取全部评委总分，去掉一个最高分和一个最低分后取平均（评委≤2直接平均）；同名评委多次提交自动合并（同一案例以最新一次为准）；去极值后保留两位小数。</div>
</div>
<script src="config.js"></script>
<script>
function e(id){return document.getElementById(id);}
async function load(){
  const pwd=(e('pwd').value||'').trim();
  if(!pwd){ e('blocks').innerHTML='<div class="empty">请先输入管理口令</div>'; return; }
  try{
    const r=await fetch(SCORING.BACKEND_URL+'/api/results?pwd='+encodeURIComponent(pwd));
    if(r.status===401){ e('blocks').innerHTML='<div class="empty" style="color:#c00000">口令错误</div>'; return; }
    const data=await r.json(); render(data,pwd);
  }catch(err){ e('blocks').innerHTML='<div class="empty">加载失败，请检查后端地址</div>'; }
}
function render(data,pwd){
  document._rd=data;
  const box=e('blocks'); 
  const rks=Object.keys(data);
  // 顶部Tab：初评/复审分开展示
  let html='<div class="tabs">';
  rks.forEach(rk=>{ html+='<button class="tab" id="tab-'+rk+'" onclick="showRound(\''+rk+'\')">'+data[rk].round_name+'</button>'; });
  html+='</div>';
  for(const rk of rks){
    const rd=data[rk];
    const dimNames=(rd.dims||[]).map(d=>d.name);
    html+='<div class="block roundblk" id="blk-'+rk+'" style="display:none"><h2>'+rd.round_name+'</h2><div class="meta">有效专家 '+rd.judge_count+' 人 · 案例 '+rd.case_count+' 个</div>';

    // ① 提交记录（评委名单+时间）
      html+='<div class="sub-title">① 提交记录（同名多次提交自动合并·同一案例以最新为准）</div>';
    const subs=rd.submissions||[];
    if(subs.length===0){ html+='<div class="empty">暂无评委提交</div>'; }
    else{
      html+='<table><tr><th>评委</th><th>提交时间</th><th class="num">已打案例数</th></tr>';
      subs.forEach(s=>{ html+='<tr><td>'+s.judge+'</td><td>'+s.ts+'</td><td class="num">'+(s.scores||[]).length+'</td></tr>'; });
      html+='</table>';
    }

    // ② 评委打分明细（按评委折叠）
    if(subs.length>0){
      html+='<div class="sub-title">② 评委打分明细（点击展开）</div>';
      subs.forEach(s=>{
        const byCase={}; (s.scores||[]).forEach(sc=>{ byCase[sc.case]=sc; });
        html+='<details class="judge-box"><summary>评委「'+s.judge+'」· '+s.ts+'</summary><div class="inner">';
        html+='<table><tr><th>案例</th>'+dimNames.map(n=>'<th class="num">'+n+'</th>').join('')+'<th class="num">总分</th></tr>';
        rd.cases.forEach((cn,idx)=>{
          const sc=byCase[idx];
          if(sc){
            const dv=(sc.dims||[]).map(v=>'<td class="num">'+(v===null||v===undefined?'—':v)+'</td>').join('');
            html+='<tr><td>'+cn+'</td>'+dv+'<td class="num" style="font-weight:700">'+sc.total+'</td></tr>';
          }
        });
        html+='</table></div></details>';
      });
    }

    // ③ 最终统计结果（总榜/省分榜/总部榜 三视图）
    html+='<div class="sub-title">③ 最终统计结果（去最高最低取平均·排序）</div>';
    if(!rd.has_meta){
      if(rd.results.length===0){ html+='<div class="empty">暂无数据</div>'; }
      else{
        html+='<table><tr><th>排名</th><th>案例名称</th><th class="num">有效专家数</th><th class="num">最高分</th><th class="num">最低分</th><th class="num">去极值平均分</th></tr>';
        rd.results.forEach(it=>{ html+='<tr><td class="num">'+it.rank+'</td><td>'+it.case+'</td><td class="num">'+it.count+'</td><td class="num">'+it.max+'</td><td class="num">'+it.min+'</td><td class="num"><b>'+it.score+'</b></td></tr>'; });
        html+='</table>';
      }
    } else {
      html+='<div class="tabs" style="margin:8px 0">';
      html+='<button class="tab on" id="rt-'+rk+'-all" onclick="showRank(\''+rk+'\',\'all\')">总榜（'+(rd.results||[]).length+'）</button>';
      html+='<button class="tab" id="rt-'+rk+'-sf" onclick="showRank(\''+rk+'\',\'sf\')">省分公司榜（'+(rd.results_sf||[]).length+'）</button>';
      html+='<button class="tab" id="rt-'+rk+'-zb" onclick="showRank(\''+rk+'\',\'zb\')">总部榜（'+(rd.results_zb||[]).length+'）</button>';
      html+='</div><div id="rktable-'+rk+'"></div>';
    }
    html+='<div style="margin-top:10px"><a href="'+SCORING.BACKEND_URL+'/api/export/'+rk+'.csv?pwd='+encodeURIComponent(pwd)+'">导出'+rd.round_name+'统计CSV</a> &nbsp;|&nbsp; <a href="'+SCORING.BACKEND_URL+'/api/export_detail/'+rk+'.csv?pwd='+encodeURIComponent(pwd)+'">导出'+rd.round_name+'打分明细CSV</a></div>';
    html+='</div>';
  }
  html+='<div class="block"><h2>评审打分二维码</h2><div class="qr-row">';
  for(const rk in data){
    const rd=data[rk];
    html+='<div><img class="qr-img" src="'+SCORING.BACKEND_URL+'/qr/'+rk+'" alt="'+rd.round_name+'"><div style="font-size:12px;color:#6b7788;margin-top:4px">'+rd.round_name+' · 扫码打分</div></div>';
  }
  html+='</div></div>';
  box.innerHTML=html;
  showRound(rks[0]);
  for(const rk in data){ if(data[rk].has_meta) drawRank(rk,'all'); }
}
const _rankData={};
function showRank(rk,which){
  ['all','sf','zb'].forEach(w=>{
    const b=document.getElementById('rt-'+rk+'-'+w); if(b) b.classList.toggle('on', w===which);
  });
  drawRank(rk,which);
}
function drawRank(rk,which){
  const win=document._rd&&document._rd[rk]; if(!win) return;
  const list=which==='sf'?win.results_sf:(which==='zb'?win.results_zb:win.results);
  const box=document.getElementById('rktable-'+rk); if(!box) return;
  if(!list||list.length===0){ box.innerHTML='<div class="empty">暂无数据</div>'; return; }
  let h='<table><tr><th>排名</th><th>案例名称</th><th>申报单位</th><th>方向</th><th class="num">专家数</th><th class="num">最高分</th><th class="num">最低分</th><th class="num">去极值平均分</th></tr>';
  list.forEach(it=>{ h+='<tr><td class="num">'+it.rank+'</td><td>'+it.case+'</td><td>'+(it.unit||'')+'</td><td>'+(it.dir||'')+'</td><td class="num">'+it.count+'</td><td class="num">'+it.max+'</td><td class="num">'+it.min+'</td><td class="num"><b>'+it.score+'</b></td></tr>'; });
  h+='</table>';
  box.innerHTML=h;
}
function showRound(rk){
  document.querySelectorAll('.roundblk').forEach(b=>{ b.style.display='none'; });
  document.querySelectorAll('.tab').forEach(t=>{ t.classList.remove('on'); });
  const blk=document.getElementById('blk-'+rk); if(blk) blk.style.display='block';
  const tb=document.getElementById('tab-'+rk); if(tb) tb.classList.add('on');
}
</script></body></html>
