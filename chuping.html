<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>初评打分</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fb;color:#1f2d3d}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 80px}
header{background:#c00000;color:#fff;border-radius:10px;padding:16px 18px;margin-bottom:16px}
header h1{font-size:20px}
header p{font-size:13px;opacity:.92;margin-top:4px}
.form-meta{display:flex;flex-wrap:wrap;gap:12px;background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:14px 16px;margin-bottom:16px}
.form-meta .field{flex:1;min-width:150px}
.form-meta label{font-size:13px;color:#6b7788;display:block;margin-bottom:4px}
.form-meta input{width:100%;border:1px solid #dbe4ea;border-radius:6px;padding:9px 10px;font-size:15px}
details.guide{background:#fffdf7;border:1px solid #e8d9a8;border-radius:10px;padding:12px 16px;margin-bottom:16px}
details.guide summary{cursor:pointer;font-size:15px;font-weight:700;color:#8a6d1a}
.gtab{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.gtab th,.gtab td{border:1px solid #e8d9a8;padding:6px 8px;text-align:center}
.gtab th{background:#faf3e3;color:#6b5a1e}
.gtab td:first-child{text-align:left;font-weight:600}
.gnote{font-size:12px;color:#8a6d1a;margin-top:8px;line-height:1.6}
.case{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.case .case-title{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.no{background:#f2f4f7;border-radius:5px;padding:2px 8px;font-size:12px;color:#6b7788}
.dims{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.dim label{display:block;font-size:12px;color:#6b7788;margin-bottom:3px}
.dim input{width:100%;border:1px solid #dbe4ea;border-radius:6px;padding:8px;font-size:15px}
.total{display:flex;align-items:center;gap:10px;border-top:1px dashed #e3e8f0;padding-top:10px}
.total label{font-size:14px;font-weight:700}
.total .star{color:#c00000}
.total input{width:90px;border:2px solid #c00000;border-radius:6px;padding:8px;font-size:16px;font-weight:700;text-align:center}
.total .hint{font-size:12px;color:#6b7788}
.total input.auto{background:#e8f7ee;border-color:#2e9e5b}
.case.err{border:2px solid #c00000;background:#fff6f6}
.dim input:disabled{background:#f5f7fa}
.bar{position:sticky;bottom:0;background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:14px;margin-top:18px;box-shadow:0 -4px 12px rgba(0,0,0,.05)}
.bar .count{font-size:13px;color:#4b5563;flex:1}
.bar #msg{font-size:13px;max-width:40%}
#msg.ok{color:#2e9e5b}
#msg.err{color:#c00000}
.submit-btn{background:#c00000;color:#fff;border:0;border-radius:8px;padding:12px 26px;font-size:16px;cursor:pointer}
.save-btn{background:#5a6a7a;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:14px;cursor:pointer;margin-right:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:99}
.mbox{background:#fff;border-radius:12px;padding:26px 20px;width:88%;max-width:340px;text-align:center}
.mbox p{font-size:15px;color:#1f2d3d;margin-bottom:20px;line-height:1.6}
.mbox button{border:0;border-radius:8px;padding:11px 20px;font-size:14px;cursor:pointer;margin:0 6px;font-weight:600}
.mbox .cancel{background:#eef1f5;color:#4b5563}
.mbox .okbtn{background:#c00000;color:#fff}
.submit-btn:disabled{opacity:.6}
.btn{display:inline-block;background:#c00000;color:#fff;border:0;border-radius:6px;padding:10px 18px;font-size:15px;text-decoration:none;margin-right:10px}
.card{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:22px;margin-bottom:16px}
.card h2{font-size:17px;margin-bottom:6px}
.card p{color:#6b7785;font-size:13px;margin-bottom:14px}
.btn.gray{background:#5a6a7a}
.btn.plain{background:#fff;color:#c00000;border:1px solid #c00000}
.note{font-size:12px;color:#9aa5b1;margin-top:10px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #e3e8f0;padding:8px 10px;text-align:left}
th{background:#f7f8fb;font-weight:600}
td.num,th.num{text-align:center}
.empty{color:#9aa5b1;text-align:center;padding:20px;font-size:13px}
.block{background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:18px;margin-bottom:24px}
.block h2{font-size:17px;margin-bottom:4px}
.block .meta{font-size:12px;color:#6b7788;margin-bottom:12px}
.qr-img{width:170px;height:170px;border:1px solid #e3e8f0;border-radius:8px}
.pager{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 0;background:#fff;border:1px solid #e3e8f0;border-radius:10px;padding:10px}
.pager .pginfo{font-size:13px;color:#6b7788;align-self:center;margin-right:6px}
.pgbtn{border:1px solid #d4dbe6;background:#fff;border-radius:6px;padding:8px 12px;font-size:14px;cursor:pointer}
.pgbtn.on{background:#c00000;color:#fff;border-color:#c00000}
.pgbtn:disabled{opacity:.4;cursor:not-allowed}
.pgbtn span{font-size:11px;opacity:.8}
input.over{border:2px solid #c00000 !important;background:#fff6f6}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tab{border:1px solid #c00000;background:#fff;color:#c00000;border-radius:8px;padding:10px 24px;font-size:15px;cursor:pointer}
.tab.on{background:#c00000;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>初评打分</h1><p>每个案例填写各维度分，总分自动计算并锁定；也可只填总分直接提交。共10个案例。</p></header>
  <details class="guide" open>
    <summary>评分说明（请先阅读）</summary>
    <table class="gtab">
      <tr><th>维度（满分）</th><th>优秀</th><th>良好</th><th>一般</th><th>较差</th></tr>
      <tr><td>立足实际场景（20分）</td><td>17—20</td><td>13—16</td><td>9—12</td><td>0—8</td></tr>
      <tr><td>体现赋能价值（20分）</td><td>17—20</td><td>13—16</td><td>9—12</td><td>0—8</td></tr>
      <tr><td>成效真实可验证（20分）</td><td>17—20</td><td>13—16</td><td>9—12</td><td>0—8</td></tr>
      <tr><td>坚持原创合规（10分）</td><td>9—10</td><td>7—8</td><td>5—6</td><td>0—4</td></tr>
      <tr><td>具备推广价值（30分）</td><td>26—30</td><td>19—25</td><td>12—18</td><td>0—11</td></tr>
    </table>
    <p class="gnote">各维度得分建议按"优秀、良好、一般、较差"四档控制；总计为各维度得分之和，满分100分。</p>
  </details>
  <div class="form-meta">
    <div class="field"><label>评委姓名（必填·实名）</label><input id="judge" autocomplete="name" placeholder="请输入姓名"></div>
  </div>
  <div id="caseList"></div>
  <div class="pager" id="pager"></div>
  <div class="bar">
    <span class="count">已填总分：<span id="filled">0</span>/10（全部答完才能提交）</span>
    <span id="msg"></span><button class="save-btn" onclick="saveDraft(false)">保存</button><button class="submit-btn" onclick="submit()">提交打分</button>
  </div>
  <div class="modal" id="confirmModal"><div class="mbox">
    <p id="confirmMsg"></p>
    <button class="cancel" id="btnCancel">返回补填</button>
    <button class="okbtn" id="btnOk">确认提交</button>
  </div></div>
</div>
<script src="config.js"></script>
<script>
const ROUND="chuping";
const CASES=["案例1", "案例2", "案例3", "案例4", "案例5", "案例6", "案例7", "案例8", "案例9", "案例10"];
const DIMS=[{"name": "立足实际场景", "max": 20}, {"name": "体现赋能价值", "max": 20}, {"name": "成效真实可验证", "max": 20}, {"name": "坚持原创合规", "max": 10}, {"name": "具备推广价值", "max": 30}];
const PAGE_SIZE=10;
let curPage=0;
const totalPages=Math.max(1,Math.ceil(CASES.length/PAGE_SIZE));
(function(){
  const wrap=document.getElementById('caseList');
  CASES.forEach((c,idx)=>{
    const card=document.createElement('div'); card.className='case'; card.dataset.i=idx;
    let h='<div class="case-title"><span class="no">'+(idx+1)+'</span><b>'+c+'</b></div><div class="dims">';
    DIMS.forEach(d=>{ h+='<div class="dim"><label>'+d.name+'（≤'+d.max+'分）</label><input type="number" step="0.01" min="0" max="'+d.max+'" data-max="'+d.max+'" data-dim="'+d.name+'" placeholder="选填"></div>'; });
    h+='</div><div class="total"><label>总分<span class="star">*</span></label><input type="number" step="0.01" min="0" max="100" placeholder="0-100" class="total-input"><span class="hint">必填·≤100</span></div>';
    card.innerHTML=h;
    card.querySelectorAll('.dim input').forEach(di=>di.addEventListener('input',()=>recalc(card)));
    const ti=card.querySelector('.total-input');
    ti.addEventListener('input',()=>{card.classList.remove('err'); liveCheck(card); refreshFilled();});
    wrap.appendChild(card);
  });
  renderPager(); showPage(0); refreshFilled();
  loadDraft();
  document.getElementById('caseList').addEventListener('input',autoDraft);
  document.getElementById('judge').addEventListener('input',autoDraft);
})();
function saveDraft(silent){
  const d={judge:document.getElementById('judge').value, scores:{}};
  document.querySelectorAll('.case').forEach(card=>{
    const dims={};
    card.querySelectorAll('.dim input').forEach(i=>{ if(i.value!=='') dims[i.dataset.dim]=i.value; });
    d.scores[card.dataset.i]={dims,total:card.querySelector('.total-input').value};
  });
  try{
    localStorage.setItem('scoring_draft_'+ROUND, JSON.stringify(d));
    if(!silent) flash('草稿已保存，下次进入自动恢复','ok');
  }catch(e){ if(!silent) flash('草稿保存失败','err'); }
}
let _draftT=null;
function autoDraft(){ clearTimeout(_draftT); _draftT=setTimeout(()=>saveDraft(true),800); }
function loadDraft(){
  try{
    const raw=localStorage.getItem('scoring_draft_'+ROUND);
    if(!raw) return;
    const d=JSON.parse(raw);
    if(d.judge) document.getElementById('judge').value=d.judge;
    Object.keys(d.scores||{}).forEach(idx=>{
      const card=document.querySelector('.case[data-i="'+idx+'"]');
      if(!card) return;
      const s=d.scores[idx]||{};
      Object.keys(s.dims||{}).forEach(k=>{
        const inp=[...card.querySelectorAll('.dim input')].find(i=>i.dataset.dim===k);
        if(inp && s.dims[k]!=='') inp.value=s.dims[k];
      });
      if(s.total) card.querySelector('.total-input').value=s.total;
      recalc(card);
    });
    refreshFilled();
    flash('已恢复上次保存的草稿','ok');
  }catch(e){}
}
function askConfirm(msg,onOk){
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmModal').style.display='flex';
  document.getElementById('btnOk').onclick=()=>{ document.getElementById('confirmModal').style.display='none'; onOk(); };
  document.getElementById('btnCancel').onclick=()=>{ document.getElementById('confirmModal').style.display='none'; };
}
function showPage(p){
  if(p<0) p=0; if(p>totalPages-1) p=totalPages-1;
  curPage=p;
  document.querySelectorAll('.case').forEach(card=>{
    const i=+card.dataset.i;
    card.style.display=(Math.floor(i/PAGE_SIZE)===p)?'':'none';
  });
  document.querySelectorAll('.pgbtn').forEach(b=>b.classList.remove('on'));
  const b=document.getElementById('pg'+p); if(b) b.classList.add('on');
  window.scrollTo(0,0);
  refreshFilled();
}
function renderPager(){
  const bar=document.getElementById('pager');
  let h='<span class="pginfo">每页'+PAGE_SIZE+'个，共'+totalPages+'页：</span>';
  h+='<button class="pgbtn" onclick="showPage(curPage-1)">上一页</button>';
  for(let p=0;p<totalPages;p++){
    h+='<button class="pgbtn" id="pg'+p+'" onclick="showPage('+p+')">第'+(p+1)+'页<span id="pgdone'+p+'"></span></button>';
  }
  h+='<button class="pgbtn" onclick="showPage(curPage+1)">下一页</button>';
  bar.innerHTML=h;
}
function pageDone(p){
  let n=0;
  document.querySelectorAll('.case').forEach(card=>{
    const i=+card.dataset.i;
    if(Math.floor(i/PAGE_SIZE)===p && card.querySelector('.total-input').value!=='') n++;
  });
  return n;
}
function refreshFilled(){
  let n=0; document.querySelectorAll('.total-input').forEach(i=>{ if(i.value!=='') n++; });
  document.getElementById('filled').textContent=n;
  for(let p=0;p<totalPages;p++){
    const el=document.getElementById('pgdone'+p);
    if(el) el.textContent=' '+pageDone(p)+'/'+PAGE_SIZE;
  }
}
function badInput(inp){
  if(inp.value==='') return false;
  const v=parseFloat(inp.value);
  if(isNaN(v)) return true;
  if(!/^\d+(\.\d{1,2})?$/.test(inp.value)) return true;
  if(inp.classList.contains('total-input')){ if(v<0||v>100) return true; }
  else { if(v<0||v>+inp.dataset.max) return true; }
  return false;
}
function liveCheck(card){
  let bad=false, over100=false;
  card.querySelectorAll('input').forEach(i=>{
    if(badInput(i)){ i.classList.add('over'); bad=true; if(i.classList.contains('total-input') && +i.value>100) over100=true; } else i.classList.remove('over');
  });
  if(over100) flash('总分不能超过100','err');
  else if(bad) flash('分值不合法：须为数字、不超上限、最多两位小数','err');
}
function recalc(card){
  const dis=card.querySelectorAll('.dim input');
  const t=card.querySelector('.total-input');
  let full=true, sum=0;
  dis.forEach(i=>{ if(i.value===''){full=false;} else {sum+=+i.value;} });
  if(full){ t.value=Math.round(sum*100)/100; t.readOnly=true; t.classList.add('auto'); }
  else { t.readOnly=false; t.classList.remove('auto'); }
  card.classList.remove('err');
  liveCheck(card);
  refreshFilled();
}
async function submit(){
  const judge=document.getElementById('judge').value.trim();
  if(!judge){ flash('请填写评委姓名','err'); return; }
  // 非法分值必须拦截（不参与确认）
  const bads=[];
  document.querySelectorAll('.case').forEach(card=>{
    card.querySelectorAll('input').forEach(i=>{ if(badInput(i)){ i.classList.add('over'); bads.push(i); } });
  });
  if(bads.length){
    const p=Math.floor(+bads[0].closest('.case').dataset.i/PAGE_SIZE);
    showPage(p);
    flash('有 '+bads.length+' 处分值不合法（超上限或超过两位小数），已标红','err');
    return;
  }
  // 收集已填（未填的允许部分提交）
  const scores=[];
  const miss=[];
  document.querySelectorAll('.case').forEach(card=>{
    const idx=+card.dataset.i; const dims={};
    card.querySelectorAll('.dim input').forEach(inp=>{ if(inp.value!=='') dims[inp.dataset.dim]=+inp.value; });
    const t=card.querySelector('.total-input').value.trim();
    if(t===''){ miss.push(card); return; }
    scores.push({case:idx,dims,total:+t});
  });
  if(scores.length===0){
    flash('请至少填写一个案例的总分（可先点保存草稿）','err');
    return;
  }
  if(miss.length){
    askConfirm('还有 '+miss.length+' 个案例未填总分。\n确认仅提交已填写的 '+scores.length+' 个案例吗？\n（也可返回补填后再提交；后续补填可再次提交，同名覆盖）',()=>doSubmit(judge,scores));
    return;
  }
  doSubmit(judge,scores);
}
async function doSubmit(judge,scores){
  const body={round:ROUND,judge,scores};
  const btn=document.querySelector('.submit-btn'); btn.disabled=true;
  try{
    const r=await fetch(SCORING.BACKEND_URL+'/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(j.ok){ try{localStorage.removeItem('scoring_draft_'+ROUND);}catch(e){} location.replace('thanks.html?j='+encodeURIComponent(judge)); return; }
    flash(j.msg,'err');
  }catch(e){ flash('提交失败，请检查网络','err'); }
  btn.disabled=false;
}
function flash(msg,type){
  const el=document.getElementById('msg');
  el.className=type; el.textContent=msg;
}
</script>
</body></html>
