})();
function doSearch(kw){
  kw=(kw||'').trim();
  const btnClear=document.getElementById('qclear');
  btnClear.style.display=kw?'inline':'none';
  if(!kw){ clearQ(); return; }
  _qMode=true; _qHits=[];
  document.querySelectorAll('.case').forEach(card=>{
    const i=+card.dataset.i;
    const hay=(UNITS[i]||'')+' '+CASES[i];
    const hit=hay.indexOf(kw)>-1;
    card.style.display=hit?'':'none';
    card.classList.toggle('hit',hit);
    if(hit)_qHits.push(i);
  });
  document.getElementById('pager').style.display='none';
  document.getElementById('qhint').textContent='命中 '+_qHits.length+' 个案例';
}
function clearQ(){
  document.getElementById('q').value='';
  document.getElementById('qclear').style.display='none';
  document.getElementById('qhint').textContent='';
  _qMode=false;_qHits=null;
  document.querySelectorAll('.case').forEach(c=>c.classList.remove('hit'));
  document.getElementById('pager').style.display='';
  showPage(0);
}
function saveDraft(silent){
  const d={judge:document.getElementById('judge').value, scores:{}};
  document.querySelectorAll('.case').forEach(card=>{
    const dims={};
    card.querySelectorAll('.dim input').forEach(i=>{ if(i.value!=='') dims[i.dataset.dim]=i.value; });
    d.scores[card.dataset.i]={dims,total:card.querySelector('.total-input').value};
  });
  try{
    localStorage.setItem('scoring_draft_'+ROUND, JSON.stringify(d));
    if(!silent) flash('草稿已保存，下次进入自动恢复','ok');
  }catch(e){ if(!silent) flash('草稿保存失败','err'); }
}
let _draftT=null;
function autoDraft(){ clearTimeout(_draftT); _draftT=setTimeout(()=>saveDraft(true),800); }
function loadDraft(){
  try{
    let raw=localStorage.getItem('scoring_draft_'+ROUND);
    let fromSnap=false;
    if(!raw){ raw=localStorage.getItem('scoring_last_'+ROUND); if(raw) fromSnap=true; }
    if(!raw) return;
    const d=JSON.parse(raw);
    if(d.judge) document.getElementById('judge').value=d.judge;
    Object.keys(d.scores||{}).forEach(idx=>{
      const card=document.querySelector('.case[data-i="'+idx+'"]');
      if(!card) return;
      const s=d.scores[idx]||{};
      Object.keys(s.dims||{}).forEach(k=>{
        const inp=[...card.querySelectorAll('.dim input')].find(i=>i.dataset.dim===k);
        if(inp && s.dims[k]!=='') inp.value=s.dims[k];
      });
      if(s.total) card.querySelector('.total-input').value=s.total;
      recalc(card);
    });
    refreshFilled();
    flash(fromSnap?'已恢复您上次提交的分数，可直接修改后重新提交':'已恢复上次保存的草稿','ok');
  }catch(e){}
}
function askConfirm(msg,onOk){
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmModal').style.display='flex';
  document.getElementById('btnOk').onclick=()=>{ document.getElementById('confirmModal').style.display='none'; onOk(); };
  document.getElementById('btnCancel').onclick=()=>{ document.getElementById('confirmModal').style.display='none'; };
}
function showPage(p){
  if(_qMode){ clearQ(); }
  if(p<0) p=0; if(p>totalPages-1) p=totalPages-1;
  curPage=p;
  document.querySelectorAll('.case').forEach(card=>{
    const i=+card.dataset.i;
    card.style.display=(Math.floor(i/PAGE_SIZE)===p)?'':'none';
  });
  document.querySelectorAll('.pgbtn').forEach(b=>b.classList.remove('on'));
  const b=document.getElementById('pg'+p); if(b) b.classList.add('on');
  window.scrollTo(0,0);
  refreshFilled();
}
function renderPager(){
  const bar=document.getElementById('pager');
  let h='<span class="pginfo">每页'+PAGE_SIZE+'个，共'+totalPages+'页：</span>';
  h+='<button class="pgbtn" onclick="showPage(curPage-1)">上一页</button>';
  for(let p=0;p<totalPages;p++){
    h+='<button class="pgbtn" id="pg'+p+'" onclick="showPage('+p+')">第'+(p+1)+'页<span id="pgdone'+p+'"></span></button>';
  }
  h+='<button class="pgbtn" onclick="showPage(curPage+1)">下一页</button>';
  bar.innerHTML=h;
}
function pageDone(p){
  let n=0;
  document.querySelectorAll('.case').forEach(card=>{
    const i=+card.dataset.i;
    if(Math.floor(i/PAGE_SIZE)===p && card.querySelector('.total-input').value!=='') n++;
  });
  return n;
}
function refreshFilled(){
  let n=0; document.querySelectorAll('.total-input').forEach(i=>{ if(i.value!=='') n++; });
  document.getElementById('filled').textContent=n;
  for(let p=0;p<totalPages;p++){
    const el=document.getElementById('pgdone'+p);
    if(el) el.textContent=' '+pageDone(p)+'/'+PAGE_SIZE;
  }
}
function badInput(inp){
  if(inp.value==='') return false;
  const v=parseFloat(inp.value);
  if(isNaN(v)) return true;
  if(!/^\d+(\.\d{1,2})?$/.test(inp.value)) return true;
  if(inp.classList.contains('total-input')){ if(v<0||v>100) return true; }
  else { if(v<0||v>+inp.dataset.max) return true; }
  return false;
}
function liveCheck(card){
  let bad=false, over100=false;
  card.querySelectorAll('input').forEach(i=>{
    if(badInput(i)){ i.classList.add('over'); bad=true; if(i.classList.contains('total-input') && +i.value>100) over100=true; } else i.classList.remove('over');
  });
  if(over100) flash('总分不能超过100','err');
  else if(bad) flash('分值不合法：须为数字、不超上限、最多两位小数','err');
}
function recalc(card){
  const dis=card.querySelectorAll('.dim input');
  const t=card.querySelector('.total-input');
  let full=true, sum=0;
  dis.forEach(i=>{ if(i.value===''){full=false;} else {sum+=+i.value;} });
  if(full){ t.value=Math.round(sum*100)/100; t.readOnly=true; t.classList.add('auto'); }
  else { t.readOnly=false; t.classList.remove('auto'); }
  card.classList.remove('err');
  liveCheck(card);
  refreshFilled();
}
async function submit(){
  const judge=document.getElementById('judge').value.trim();
  if(!judge){ flash('请填写评委姓名','err'); return; }
  // 非法分值必须拦截（不参与确认）
  const bads=[];
  document.querySelectorAll('.case').forEach(card=>{
    card.querySelectorAll('input').forEach(i=>{ if(badInput(i)){ i.classList.add('over'); bads.push(i); } });
  });
  if(bads.length){
    const p=Math.floor(+bads[0].closest('.case').dataset.i/PAGE_SIZE);
    showPage(p);
    flash('有 '+bads.length+' 处分值不合法（超上限或超过两位小数），已标红','err');
    return;
  }
  // 收集已填（未填的允许部分提交）
  const scores=[];
  const miss=[];
  document.querySelectorAll('.case').forEach(card=>{
    const idx=+card.dataset.i; const dims={};
    card.querySelectorAll('.dim input').forEach(inp=>{ if(inp.value!=='') dims[inp.dataset.dim]=+inp.value; });
    const t=card.querySelector('.total-input').value.trim();
    if(t===''){ miss.push(card); return; }
    scores.push({case:idx,dims,total:+t});
  });
  if(scores.length===0){
    flash('请至少填写一个案例的总分（可先点保存草稿）','err');
    return;
  }
  if(miss.length){
    askConfirm('还有 '+miss.length+' 个案例未填总分。\n确认先提交已填写的 '+scores.length+' 个吗？\n（后续可随时补填再提交；多次提交自动合并，同一案例以最新为准）',()=>doSubmit(judge,scores));
    return;
  }
  doSubmit(judge,scores);
}
function submitDone(judge,scores){
  try{ const snap={judge:judge, scores:{}}; scores.forEach(sc=>{ snap.scores[sc.case]={dims:(sc.dims||{}), total:sc.total}; }); localStorage.setItem('scoring_last_'+ROUND, JSON.stringify(snap)); localStorage.removeItem('scoring_draft_'+ROUND);}catch(e){}
  location.replace('thanks.html?j='+encodeURIComponent(judge));
}
const CDN_CFG='https://cdn.jsdelivr.net/gh/kunshanwang112-boop/kunshanwang@main/config.js';
async function fetchLatestBackend(){
  const urls=[CDN_CFG+'?ts='+Date.now(), 'config.js?ts='+Date.now()];
  for(const u of urls){
    try{ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) continue; const t=await r.text(); const m=t.match(/BACKEND_URL:\s*"([^"]+)"/); if(m&&m[1]) return m[1]; }catch(e){}
  }
  return null;
}
function tryPost(url,body){
  return fetch(url+'/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
}
async function doSubmit(judge,scores){
  const body={round:ROUND,judge,scores};
  const btn=document.querySelector('.submit-btn'); btn.disabled=true;
  try{
    const j=await tryPost(SCORING.BACKEND_URL,body);
    if(j.ok){ submitDone(judge,scores); return; }
    flash(j.msg,'err'); btn.disabled=false; return;
  }catch(e){}
  for(let i=1;i<=6;i++){
    flash('网络波动，正在自动恢复（第'+i+'/6次，请勿关闭页面）...','err');
    const nu=await fetchLatestBackend();
    if(nu) SCORING.BACKEND_URL=nu;
    try{
      const j=await tryPost(SCORING.BACKEND_URL,body);
      if(j.ok){ submitDone(judge,scores); return; }
      flash(j.msg,'err'); btn.disabled=false; return;
    }catch(e){}
    await new Promise(rs=>setTimeout(rs,8000));
  }
  flash('提交失败：请过10秒后再点一次提交；分数已自动保存不会丢失','err');
  btn.disabled=false;
}
function flash(msg,type){
  const el=document.getElementById('msg');
  el.className=type; el.textContent=msg;
}
</script>
</body></html>
