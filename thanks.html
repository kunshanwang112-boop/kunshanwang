<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">

<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fb;display:flex;align-items:center;justify-content:center;min-height:100vh}

.btn{display:inline-block;background:#c00000;color:#fff;border:0;border-radius:6px;padding:11px 28px;font-size:15px;text-decoration:none;margin-top:20px}

<body><div class="box">

</div>
